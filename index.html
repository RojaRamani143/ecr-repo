<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECR & ECS Practice App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
    }
    main {
      width: min(650px, 100%);
      padding: 42px 32px;
      text-align: center;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      color: #bfdbfe;
      background: rgba(59,130,246,.2);
      font-size: 13px;
      letter-spacing: .5px;
    }
    h1 { margin: 22px 0 12px; font-size: clamp(30px, 6vw, 46px); }
    p { color: #cbd5e1; line-height: 1.7; }
    .status {
      margin: 26px auto 0;
      padding: 14px;
      max-width: 420px;
      color: #bbf7d0;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.35);
      border-radius: 12px;
    }
    footer { margin-top: 30px; color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">DOCKER • AMAZON ECR • AMAZON ECS</span>
    <h1>Hello from AWS!</h1>
    <p>
      This is a simple static website running inside a Docker container.
      Build the image, push it to Amazon ECR, and deploy it using Amazon ECS.
    </p>
    <div class="status">✓ Your ECR and ECS practice application is ready.</div>
    <footer>Simple Web App | Built for hands-on DevOps practice</footer>
  </main>
</body>
</html>
